# USV Fleet Configuration for Distributed Launch
# 该文件定义了 USV 集群的机器配置，用于地面站远程启动
# 
# 使用说明：
# 1. 配置每艘 USV 的网络信息（IP、用户名、工作空间路径）
# 2. 在地面站启动时，会通过 SSH 自动启动各 USV 节点
# 3. 确保已配置免密 SSH 登录：ssh-copy-id usv@<usv_ip>

# ==================== USV 机器配置 ====================
# 每个 USV 需要配置以下信息：
# - enabled: 是否启用该 USV（true/false）
# - hostname: 机载计算机的 IP 地址或主机名
# - username: SSH 登录用户名
# - workspace: 机载计算机上的 ROS 2 工作空间路径
# - namespace: ROS 2 命名空间（格式：usv_XX）
# - fcu_url: 飞控串口配置（格式：serial://<device>:<baudrate>）
# - system_id: MAVLink 系统 ID（与 namespace 后缀对应）
# - gcs_url: 地面站通信地址（可选，用于 MAVLink 转发）
# - platform_mode: 平台模式（2d/3d）。GS 将按该模式下发 XY/Z 到达阈值；USV 端也会据此决定是否忽略 Z、roll/pitch。
# - vehicle_type: 载具类型（bionic_airship / bionic_dolphin / flying_sphere / usv）
# - safety_radius: 机型安全包络半径（米），用于异构避碰与编队间距计算
# - default_altitude: 默认巡航/分层高度（米），当 2D XML 航点未指定 Z 时自动分层
# - reach_xy_threshold / reach_z_threshold: 专属水平/高度到达判定阈值（米）

usv_fleet:
  # ==================== USV 01 (28m 仿生飞艇) ====================
  usv_01:
    enabled: true                                    # 是否启用
    hostname: "192.168.68.55"                       # USV 01 机载计算机 IP
    username: "chenhangwei"                                  # SSH 用户名
    password: "c3467684"                                    # SSH 密码 (用于重启)
    workspace: "/home/chenhangwei/usv_workspace"             # 机载工作空间路径
    namespace: "usv_01"                              # ROS 2 命名空间
    vehicle_type: "bionic_airship"                   # 28m 矢量飞艇
    platform_mode: "3d"                              # 2d/3d（默认 3d）
    safety_radius: 16.0                              # 28m 飞艇安全包络半径
    default_altitude: 15.0                           # 默认起飞预高度 15m
    landing_altitude: 0.5                            # 默认降落保护锁桨高度 0.5m
    reach_xy_threshold: 4.0                          # 水平到点阈值 4m
    reach_z_threshold: 1.5                           # 高度到点阈值 1.5m
    fcu_url: "udp://192.168.10.1:14550@192.168.10.2:14550"          # 飞控串口
    system_id: 1                                     # MAVLink 系统 ID
    gcs_url: "udp://192.168.68.55:14551@192.168.68.50:14550"      # 地面站通信地址（可选）
    
  # ==================== USV 02 (5m 仿生海豚) ====================
  usv_02:
    enabled: true
    hostname: "192.168.68.54"
    username: "chenhangwei"
    password: "c3467684"
    workspace: "/home/chenhangwei/usv_workspace"
    namespace: "usv_02"
    vehicle_type: "bionic_dolphin"                   # 5m 仿生海豚
    platform_mode: "3d"                              # 2d/3d（按需修改）
    safety_radius: 3.5                               # 5m 海豚安全包络半径
    default_altitude: 6.0                            # 默认起飞预高度 6m
    landing_altitude: 0.3                            # 默认降落保护锁桨高度 0.3m
    reach_xy_threshold: 1.5                          # 水平到点阈值 1.5m
    reach_z_threshold: 0.8                           # 高度到点阈值 0.8m
    fcu_url: "serial:///dev/ttyACM0:921600"
    system_id: 2
    gcs_url: "udp://192.168.68.54:14552@192.168.68.50:14560"
    
  # ==================== USV 03 (1.8m 飞行球) ====================
  usv_03:
    enabled: true
    hostname: "192.168.68.52"
    username: "chenhangwei"
    password: "c3467684"
    workspace: "/home/chenhangwei/usv_workspace"
    namespace: "usv_03"
    vehicle_type: "flying_sphere"                    # 1.8m 飞行球
    platform_mode: "3d"                              # 2d/3d（按需修改）
    safety_radius: 1.5                               # 1.8m 飞行球安全包络半径
    default_altitude: 2.0                            # 默认起飞预高度 2m
    landing_altitude: 0.25                           # 默认降落保护锁桨高度 0.25m
    reach_xy_threshold: 0.8                          # 水平到点阈值 0.8m
    reach_z_threshold: 0.5                           # 高度到点阈值 0.5m
    fcu_url: "serial:///dev/ttyACM0:921600"
    system_id: 3
    gcs_url: "udp://192.168.68.52:14553@192.168.68.50:14570"

  # ==================== USV 04 (0.6m x 0.3m 差速无人船) ====================
  usv_04:
    enabled: true
    hostname: "192.168.68.53"
    username: "chenhangwei"
    password: "c3467684"
    workspace: "/home/chenhangwei/usv_workspace"
    namespace: "usv_04"
    vehicle_type: "usv_diff"                         # PX4 差速推进无人船 (50002 / SITL 4025)
    platform_mode: "2d"                              # 水面 2D 模式（忽略 Z 误差）
    nav_mode: "rl"                                   # 默认端到端 RL 速度-角速度控制
    safety_radius: 0.8                               # 0.6m 无人船安全半径
    default_altitude: 0.0                            # 水面高度 0m
    reach_xy_threshold: 0.5                          # 水平到点阈值 0.5m
    reach_z_threshold: 0.8                           # 水面 Z 阈值放宽
    fcu_url: "serial:///dev/ttyACM0:921600"
    system_id: 4
    gcs_url: "udp://192.168.68.53:14554@192.168.68.50:14580"

# ==================== 启动选项 ====================
launch_options:
  # 是否使用本地模拟（不通过 SSH 启动，用于单机测试）
  use_local_simulation: false
  
  # SSH 连接超时（秒）
  ssh_timeout: 10.0
  
  # 启动间隔（秒，避免同时启动导致网络拥塞）
  launch_delay: 2.0
  
  # 是否显示远程节点的输出（true=转发到地面站终端）
  show_remote_output: true
  
  # 失败重试次数
  max_retries: 2

# ==================== 网络配置 ====================
network:
  # ROS_DOMAIN_ID（确保与地面站一致）
  ros_domain_id: 0
  
  # ROS 2 DDS 发现超时（秒）
  discovery_timeout: 30.0
